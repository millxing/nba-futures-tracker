name: Daily snapshot

on:
  schedule:
    # GitHub queues scheduled runs hardest on the hour and at :15/:30, and in
    # practice only delivered ~2 of these slots per day at :15 (4-5 hours late).
    # Off-peak minutes queue sooner. Each run snapshots the most recent 6 AM ET
    # via prices-history, so a late run still captures the 6 AM prices and runs
    # after the first one are no-ops.
    - cron: "7 10-16 * * *"
    - cron: "38 10-16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Take snapshot
        # Snapshots the most recent 6 AM ET (a no-op if it already exists).
        run: python scripts/snapshot.py

      - name: Rebuild site data and push
        # Rebuild + commit only when a new snapshot file was written; otherwise
        # build_data.py would commit a timestamp-only data.json change.
        run: |
          if git status --porcelain snapshots/ | grep -q .; then
            python scripts/build_data.py
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add snapshots docs/data
            git commit -m "Daily snapshot $(TZ=America/New_York date '+%Y-%m-%d')"
            git push
          else
            echo "No new snapshot; nothing to commit."
          fi
