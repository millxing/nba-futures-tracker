name: Daily snapshot

on:
  schedule:
    # 6:15 AM ET is 10:15 UTC during EDT and 11:15 UTC during EST.
    # Both hours are scheduled; snapshot.py --cron exits unless the ET hour is 6.
    - cron: "15 10,11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Take snapshot
        # The ET-hour guard only applies to scheduled runs; manual dispatches
        # always snapshot the most recent 6 AM ET (a no-op if it already exists).
        run: python scripts/snapshot.py ${{ github.event_name == 'schedule' && '--cron' || '' }}

      - name: Rebuild site data and push
        # Rebuild + commit only when a new snapshot file was written; otherwise
        # build_data.py would commit a timestamp-only data.json change.
        run: |
          if git status --porcelain snapshots/ | grep -q .; then
            python scripts/build_data.py
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add snapshots docs/data
            git commit -m "Daily snapshot $(TZ=America/New_York date '+%Y-%m-%d')"
            git push
          else
            echo "No new snapshot; nothing to commit."
          fi
